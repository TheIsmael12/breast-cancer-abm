name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements.txt pyflakes pytest
      - name: Lint (pyflakes)
        run: python -m pyflakes *.py tests/*.py
      - name: Prueba de humo
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests
