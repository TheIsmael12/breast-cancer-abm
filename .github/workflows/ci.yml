name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: comprobar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Pruebas (humo + huella del modelo)
        env:
          MPLBACKEND: Agg
        run: pytest
